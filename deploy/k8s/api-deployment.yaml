apiVersion: apps/v1
kind: Deployment
metadata:
  name: anon-chat-api
  labels:
    app: anon-chat-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: anon-chat-api
  template:
    metadata:
      labels:
        app: anon-chat-api
    spec:
      containers:
        - name: api
          image: ghcr.io/OWNER/anon-chat-ai/anon-chat-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: anon-chat-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: anon-chat-api-svc
spec:
  selector:
    app: anon-chat-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: anon-chat-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: anon-chat-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
